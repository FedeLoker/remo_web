name: Only stage or hotfix can target main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch is stage or hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Validate source repository and branch
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "Only pull requests from branches in $TARGET_REPOSITORY can target main."
            exit 1
          fi

          case "$HEAD_BRANCH" in
            stage|hotfix/*) ;;
            *)
              echo "Only pull requests from stage or hotfix/* can target main."
              exit 1
              ;;
          esac
